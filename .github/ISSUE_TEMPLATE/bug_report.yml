name: Bug Report
description: Something isn't working as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `rusttp --version`
      placeholder: "e.g. rusttp 0.1.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (x64)
        - Linux (ARM64)
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Windows (x64)
        - Other
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command Ran
      description: The exact command that triggered the bug
      render: shell
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include error output.
      render: shell
    validations:
      required: true
